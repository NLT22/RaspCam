{% extends "base.html" %}
{% block title %}Đăng nhập – RaspCam{% endblock %}
{% block body %}
<main class="login">
  <form method="post" action="/login">
    <div class="brand"><i class="brand-mark" aria-hidden="true"></i>RaspCam</div>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <label>Tên đăng nhập<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Đăng nhập</button>
  </form>
</main>
{% endblock %}
