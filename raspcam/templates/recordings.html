{% extends "base.html" %}
{% block title %}Xem lại – RaspCam{% endblock %}
{% block body %}
{% set active = "recordings" %}
{% include "nav.html" %}
<main class="page review">
  <div class="stage">
    <div class="screen">
      <video id="va" playsinline muted preload="auto"></video>
      <video id="vb" playsinline muted preload="auto" hidden></video>
      <div class="osd"><time id="osd"></time></div>
      <div class="screen-msg" id="empty" hidden>
        <strong>Chưa có bản ghi nào</strong>
        <span>Camera ghi liên tục. Đoạn đầu tiên sẽ xuất hiện ở đây sau khoảng một phút.</span>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>

    <div class="controls" id="controls" hidden>
      <button id="play" class="primary icon" aria-label="Phát" title="Phát / dừng (Space)"></button>
      <button class="icon" data-seek="-10" aria-label="Lùi 10 giây" title="Lùi 10 giây (←, giữ Shift: 1 phút)">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">10</text></svg>
      </button>
      <button class="icon" data-seek="10" aria-label="Tới 10 giây" title="Tới 10 giây (→, giữ Shift: 1 phút)">
        <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">10</text></svg>
      </button>
      <span class="spacer"></span>
      <div class="segmented" role="group" aria-label="Phạm vi dòng thời gian">
        <button data-zoom="day" aria-pressed="true">24 giờ</button>
        <button data-zoom="hour" aria-pressed="false">1 giờ</button>
      </div>
      <button id="rate" class="rate-btn" title="Tốc độ phát: bấm để đổi">1x</button>
      <a class="button icon" id="download" href="#" download aria-label="Tải phút này" title="Tải phút này">
        <svg viewBox="0 0 24 24"><path d="M11 4h2v8.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3zM5 18h14v2H5z"/></svg>
      </a>
    </div>

    <div class="timeline" id="timeline" hidden>
      <div class="track" id="track" role="slider" tabindex="0" aria-label="Chọn thời điểm"></div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </div>
  </div>

  <aside class="side" id="side" hidden>
    <div class="day">
      <button id="prev-day" class="icon" aria-label="Ngày trước"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
      <h2 id="day-label"></h2>
      <button id="next-day" class="icon" aria-label="Ngày sau"><svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
    </div>
    <p class="side-summary" id="summary"></p>
    <ol class="activity" id="activity"></ol>
    <div class="side-empty" id="side-empty" hidden>
      <p id="side-empty-text"></p>
      <button id="from-start">Xem từ đầu ngày</button>
    </div>
  </aside>
</main>
<script src="/static/recordings.js"></script>
{% endblock %}
